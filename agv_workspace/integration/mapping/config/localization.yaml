map_server:
  ros__parameters:
    use_sim_time: false

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    update_min_d: 0.05
    update_min_a: 0.05
    tf_broadcast: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    attempt_respawn_reconnection: false
    node_names:
      - map_server
      - amcl
