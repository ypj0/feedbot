slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    transform_publish_period: 0.02
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    use_map_saver: true
